<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参加申込み | つながり子ども食堂</title>

  <link rel="stylesheet" href="../CSS/common.css">
  <link rel="stylesheet" href="../CSS/header.css">
</head>

<body>

  <div id="header"></div>

  <main>
  <section class="page-intro" aria-labelledby="reserve-title">
    <p class="eyebrow">参加をお考えの方へ</p>
    <h1 id="reserve-title">参加申込み</h1>
    <p>ご希望の参加方法をお選びください。</p>
  </section>

  <section class="section" aria-label="参加方法を選ぶ">
    <div class="card-grid">
      <article class="card">
        <h2>子ども食堂に参加する</h2>
        <p>
          子どもも、大人も、学生も。<br>
          食事や交流を楽しみに、ぜひお越しください。
        </p>
        <p>開催日時・参加費・持ち物と、お申込み方法をご案内します。</p>

        <div class="button-group">
          <a class="button" href="reserve-meal.html">
            子ども食堂に参加する →
          </a>
        </div>
      </article>

      <article class="card">
        <h2>ボランティアとして参加する</h2>
        <p>
          調理や子どもたちとの遊び、事前準備など、<br>
          活動を一緒に支えてくださる方を募集しています。
        </p>
        <p>お手伝いの内容と、お申込み方法をご案内します。</p>

        <div class="button-group">
          <a
            class="button button-outline"
            href="reserve-volunteer.html"
          >
            ボランティアとして参加する →
          </a>
        </div>
      </article>
    </div>
  </section>
</main>

   <script src="../JS/header.js"></script>


</body>
</html>
